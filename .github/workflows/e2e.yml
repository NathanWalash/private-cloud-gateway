name: E2E Tests

on:
  # Run automatically: nightly, and on every release tag.
  schedule:
    - cron: "0 4 * * *"
  push:
    tags:
      - "v*"
  # Also runnable on demand; inputs are optional (bootstrap creds default below).
  workflow_dispatch:
    inputs:
      email:
        description: "Admin email to test with (optional)"
        required: false
      password:
        description: "Admin password to test with (optional)"
        required: false
        type: string

jobs:
  e2e:
    name: End-to-end tests
    runs-on: ubuntu-latest
    # Bootstrap credentials — use the provided inputs, or defaults for
    # scheduled/tag runs that have no inputs.
    env:
      TEST_EMAIL: ${{ inputs.email || 'e2e@test.local' }}
      TEST_PASSWORD: ${{ inputs.password || 'e2e-test-pass-1234' }}
      # Layer the coverage overlay so the core runs a coverage-instrumented
      # build; it flushes to .coverage/e2e on graceful shutdown (teardown).
      COMPOSE_FILES: "-f infra/docker/docker-compose.yml -f infra/docker/docker-compose.coverage.yml"

    steps:
      - uses: actions/checkout@v7

      - name: Prepare coverage dirs
        run: mkdir -p .coverage/unit .coverage/e2e

      - name: Create .env
        run: |
          cp .env.example .env
          echo "CLOUD_CORE_SESSION_SECRET=$(openssl rand -hex 32)" >> .env
          echo "CLOUD_CORE_BOOTSTRAP_EMAIL=$TEST_EMAIL" >> .env
          echo "CLOUD_CORE_BOOTSTRAP_PASSWORD=$TEST_PASSWORD" >> .env
          echo "CLOUD_CORE_LOGIN_URL=http://home.localtest.me/login" >> .env
          echo "CLOUD_CORE_COOKIE_DOMAIN=localtest.me" >> .env

      - name: Add hosts entries
        run: |
          echo "127.0.0.1 home.localtest.me" | sudo tee -a /etc/hosts
          echo "127.0.0.1 files.localtest.me" | sudo tee -a /etc/hosts

      - name: Start stack
        run: docker compose $COMPOSE_FILES up -d --build
        timeout-minutes: 5

      - name: Wait for stack healthy
        run: |
          for i in $(seq 1 30); do
            if curl -sf http://home.localtest.me/healthz > /dev/null 2>&1; then
              echo "Stack healthy after ${i}s"
              exit 0
            fi
            sleep 2
          done
          echo "Stack did not become healthy"
          docker compose $COMPOSE_FILES logs core
          exit 1

      - name: Run shell E2E tests (unauthenticated)
        run: bash scripts/e2e.sh

      - uses: actions/setup-go@v7
        with:
          go-version: "1.26"
          cache-dependency-path: apps/core/go.sum

      # Unit coverage in atomic covdata format, so it merges with the
      # instrumented E2E stack's data after teardown. -count=1 defeats the test
      # cache (a cached run writes no coverage).
      - name: Unit-test coverage
        working-directory: apps/core
        run: >
          go test -count=1 -cover -covermode=atomic -coverpkg=./... ./...
          -args -test.gocoverdir="$GITHUB_WORKSPACE/.coverage/unit"

      - name: Run Go E2E tests
        run: |
          go test -count=1 -v -tags e2e -timeout 900s ./e2e/...
        working-directory: apps/core
        env:
          E2E_BASE_URL: http://home.localtest.me
          E2E_FILES_URL: http://files.localtest.me
          E2E_RESOLVE: 127.0.0.1
          E2E_EMAIL: ${{ env.TEST_EMAIL }}
          E2E_PASSWORD: ${{ env.TEST_PASSWORD }}
          # A static app + a multi-container app (Postgres sidecar) exercise both
          # the single- and multi-container install paths in CI.
          E2E_APPS: excalidraw,umami

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install Playwright
        working-directory: e2e
        run: |
          npm ci
          npx playwright install --with-deps chromium

      - name: Run Playwright browser E2E
        working-directory: e2e
        run: npx playwright test
        env:
          E2E_BASE_URL: http://home.localtest.me
          E2E_RESOLVE: 127.0.0.1
          E2E_EMAIL: ${{ env.TEST_EMAIL }}
          E2E_PASSWORD: ${{ env.TEST_PASSWORD }}

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: e2e/playwright-report/
          retention-days: 7

      # Teardown sends SIGTERM; the instrumented core shuts down gracefully and
      # flushes its coverage counters to .coverage/e2e (a bind mount, so -v does
      # not wipe them).
      - name: Tear down
        if: always()
        run: docker compose $COMPOSE_FILES down -v

      - name: Combined coverage report
        if: always()
        working-directory: apps/core
        run: |
          UNIT="$GITHUB_WORKSPACE/.coverage/unit"
          E2E="$GITHUB_WORKSPACE/.coverage/e2e"
          MERGED="$GITHUB_WORKSPACE/.coverage/merged"
          mkdir -p "$MERGED"
          INPUTS="$UNIT"
          if compgen -G "$E2E/covcounters.*" >/dev/null; then
            INPUTS="$UNIT,$E2E"
          else
            echo "warning: no E2E coverage counters — reporting unit only"
          fi
          go tool covdata merge -i="$INPUTS" -o="$MERGED"
          go tool covdata textfmt -i="$MERGED" -o="$GITHUB_WORKSPACE/.coverage/coverage.txt"
          {
            echo "## Combined coverage (unit + E2E)"
            echo '```'
            go tool covdata percent -i="$MERGED" | sort
            echo '```'
            printf '**Total:** '
            go tool cover -func="$GITHUB_WORKSPACE/.coverage/coverage.txt" | tail -1 | awk '{print $NF}'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload coverage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: .coverage/coverage.txt
          retention-days: 7
