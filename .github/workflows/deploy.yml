name: Deploy to production

# Manual, deliberate deploys only — never automatic on push. Pick a released tag.
on:
  workflow_dispatch:
    inputs:
      version:
        description: "Release tag to deploy (e.g. v0.6.0)"
        required: true

permissions:
  contents: read

concurrency:
  group: production-deploy
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy ${{ github.event.inputs.version }}
    runs-on: ubuntu-latest
    steps:
      - name: Deploy over SSH
        env:
          SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          SSH_HOST: ${{ secrets.DEPLOY_SSH_HOST }}
          SSH_USER: ${{ secrets.DEPLOY_SSH_USER }}
          VERSION: ${{ github.event.inputs.version }}
        run: |
          install -d -m 700 ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/id_deploy
          chmod 600 ~/.ssh/id_deploy
          ssh-keyscan -H "$SSH_HOST" >> ~/.ssh/known_hosts 2>/dev/null
          ssh -i ~/.ssh/id_deploy "$SSH_USER@$SSH_HOST" \
            "sudo /opt/pcg/scripts/deploy.sh '$VERSION'"
