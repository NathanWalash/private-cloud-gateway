id: umami
name: Umami
description: Privacy-friendly, cookie-free web analytics for your own sites — a lightweight self-hosted alternative to Google Analytics.
category: productivity

route:
  subdomain: analytics
  internal_port: 3000

container:
  image: ghcr.io/umami-software/umami:postgresql-v2.14.0
  environment:
    - DATABASE_TYPE=postgresql
    - DATABASE_URL=postgresql://umami:umami@db:5432/umami
  volumes: []

services:
  - name: db
    image: postgres:16-alpine
    environment:
      - POSTGRES_USER=umami
      - POSTGRES_PASSWORD=umami
      - POSTGRES_DB=umami
    volumes:
      - pcg-umami-db:/var/lib/postgresql/data
    memory_limit: 512m
    backup:
      dump: ["pg_dump", "-U", "umami", "umami"]
      restore: ["psql", "-U", "umami", "-d", "umami"]

lifecycle:
  policy: always-on

health:
  path: /api/heartbeat
  expected_status: 200
  timeout_seconds: 10

backup:
  enabled: false

resources:
  memory_limit: 512m
