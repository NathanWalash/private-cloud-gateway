id: cyberchef
name: CyberChef
description: The "Cyber Swiss Army Knife" — encode/decode, encryption, hashing, data conversion, and 300+ operations, all offline in your browser.
category: utilities

route:
  subdomain: cyberchef
  internal_port: 80

container:
  image: ghcr.io/gchq/cyberchef:10.19.4
  environment: []
  volumes: []

lifecycle:
  policy: scale-to-zero
  sleep_after_minutes: 30

health:
  path: /
  expected_status: 200
  timeout_seconds: 10

backup:
  enabled: false

resources:
  memory_limit: 256m
