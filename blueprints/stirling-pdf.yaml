id: stirling-pdf
name: Stirling PDF
description: Merge, split, compress, convert, and edit PDFs. Over 50 PDF tools in one place.
icon: "📄"
category: utilities

route:
  subdomain: pdf
  internal_port: 8080

container:
  image: frooodle/s-pdf:2.14.3
  environment:
    - DOCKER_ENABLE_SECURITY=false
    - INSTALL_BOOK_AND_ADVANCED_HTML_OPS=false
    # The image caps JVM metaspace at 128m, which is too small for Stirling v2
    # (Spring Boot 4) — it OOMs on Metaspace and restart-loops. Raise it.
    - JAVA_TOOL_OPTIONS=-XX:MaxMetaspaceSize=512m -XX:MaxRAMPercentage=60
  volumes: []

lifecycle:
  policy: scale-to-zero
  sleep_after_minutes: 15

health:
  # "/" returns 401 (Stirling v2 has its own login); use the public status API.
  path: /api/v1/info/status
  expected_status: 200
  timeout_seconds: 30

backup:
  enabled: false

resources:
  memory_limit: 2g
