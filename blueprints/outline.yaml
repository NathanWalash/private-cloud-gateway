id: outline
name: Outline
description: A fast, collaborative knowledge base and wiki for your projects — documents, notes, and great search. Self-hosted team documentation.
category: productivity

# Coming soon: beyond Postgres + Redis, Outline requires an external
# authentication provider (OIDC/Google/Slack) to log in — there's no built-in
# email/password. It can't be used standalone until the gateway can act as an
# OIDC provider for it, so it stays listed-but-not-installable.
coming_soon: true

route:
  subdomain: wiki
  internal_port: 3000

container:
  image: outlinewiki/outline:0.82.0
  environment: []
  volumes: []

lifecycle:
  policy: always-on

health:
  path: /_health
  expected_status: 200
  timeout_seconds: 10

backup:
  enabled: false

resources:
  memory_limit: 512m
