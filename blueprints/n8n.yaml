id: n8n
name: n8n
description: Workflow automation. Connect apps, trigger on events, run code, and automate repetitive tasks. Like Zapier but self-hosted.
icon: "⚡"
category: automation

route:
  subdomain: n8n
  internal_port: 5678

container:
  image: docker.n8n.io/n8nio/n8n:2.35.3
  environment:
    - N8N_HOST=n8n.${DOMAIN}
    - N8N_PROTOCOL=${SCHEME}
    - NODE_ENV=production
    - WEBHOOK_URL=${SCHEME}://n8n.${DOMAIN}/
  volumes:
    - pcg-n8n-data:/home/node/.n8n

lifecycle:
  policy: always-on

health:
  path: /healthz
  expected_status: 200
  timeout_seconds: 30

backup:
  enabled: true
  paths:
    - /var/lib/cloud-core/apps/n8n/data

  container_paths:
    - /home/node/.n8n

resources:
  memory_limit: 1024m
